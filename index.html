<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Personalized 4-Day Upper/Lower Workout & Mobility Routine with Timers, Tempo Metronome, and Tracking" />
    <title>4-Day Workout & Mobility System</title>
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      /* Loading screen painted before the app code arrives; React replaces it on first render */
      .boot-bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #1e293b; }
      .boot-logo { width: 34px; height: 34px; border-radius: 10px; background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.35); }
      .boot-title { font-weight: 700; font-size: 16px; color: #f8fafc; }
      .boot-body { padding: 16px; display: grid; gap: 12px; max-width: 1280px; margin: 0 auto; }
      .boot-card { height: 72px; border-radius: 16px; background: #0f172a; border: 1px solid #1e293b; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-card.tall { height: 180px; }
      .boot-note { text-align: center; color: #64748b; font-size: 13px; padding-top: 4px; }
      @keyframes boot-pulse { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .boot-card { animation: none; } }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-emerald-500 selection:text-slate-950">
    <div id="root">
      <div aria-busy="true" aria-label="Loading your workout">
        <div class="boot-bar"><div class="boot-logo"></div><div class="boot-title">4-Day Upper/Lower</div></div>
        <div class="boot-body">
          <div class="boot-card"></div>
          <div class="boot-card tall"></div>
          <div class="boot-card tall"></div>
          <div class="boot-note">Loading your workout…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 1. Vite chunk load failure recovery
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('Vite preload error, reloading to fetch fresh chunks...', event);
        window.location.reload();
      });

      // 2. Global script/link 404 recovery (stale cache Buster)
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Resource load error detected on:', e.target.src || e.target.href);
          if ('caches' in window && !sessionStorage.getItem('asset_retry_done')) {
            sessionStorage.setItem('asset_retry_done', 'true');
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).then(function() {
              window.location.reload();
            });
          }
        }
      }, true);

      // 3. Service Worker registration with instant update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                });
              }
            });
          }).catch(function() {});
        });
      }
    </script>
  </body>
</html>
